# Deploys the site to layeredrelics.com (Namecheap shared hosting) over FTPS
# on every push to main, or by hand from the Actions tab (Run workflow).
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   FTPSERVER  FTP server hostname (the cPanel server name, e.g. serverNNN.web-hosting.com)
#   FTPUSER    full FTP login, e.g. deploy@layeredrelics.com
#   FTPPASS    that FTP account's password
# Optional repository variable:
#   FTP_SERVER_DIR  folder to upload into, relative to the FTP account's home (default ./)
#
# Use a cPanel FTP account whose directory is locked to the site folder (layeredrelics.com),
# so this workflow can't touch anything else on the hosting account.
name: Deploy to Namecheap (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets are set
        env:
          FTPSERVER: ${{ secrets.FTPSERVER }}
          FTPUSER: ${{ secrets.FTPUSER }}
          FTPPASS: ${{ secrets.FTPPASS }}
        run: |
          missing=""
          [ -n "$FTPSERVER" ] || missing="$missing FTPSERVER"
          [ -n "$FTPUSER" ] || missing="$missing FTPUSER"
          [ -n "$FTPPASS" ] || missing="$missing FTPPASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions (see README)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        # Only the public site files are uploaded (not the README, workflows, etc.).
        run: |
          mkdir -p _site
          cp -r index.html 404.html .htaccess robots.txt sitemap.xml assets css js data _site/

      - name: Upload via FTPS
        # Only files this action uploaded itself are ever updated or deleted on the server
        # (tracked in .ftp-deploy-sync-state.json), so other files such as .well-known/
        # (HTTPS certificate renewal) and cgi-bin/ are left alone.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPSERVER }}
          username: ${{ secrets.FTPUSER }}
          password: ${{ secrets.FTPPASS }}
          protocol: ftps
          port: 21
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
