<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Layered Relics</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f2428">
  <!-- Served for any missing path (see .htaccess), possibly from a nested URL,
       so the script below rewrites the relative links to point at the site root. -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1.25rem; }
    .lost img { width: 180px; margin: 0 auto 1.5rem; }
    .lost h1 { font-size: clamp(2rem, 7vw, 3.2rem); color: var(--copper-light); }
    .lost p { color: var(--text-muted); max-width: 40ch; margin: 0 auto 1.75rem; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="assets/logo.svg" alt="Layered Relics logo">
      <h1>This relic is lost</h1>
      <p>The page you were looking for has wandered off the map. Let's get you back on the path.</p>
      <a class="btn btn-primary" href="./">Back to Layered Relics</a>
    </div>
  </main>
  <script>
    // The site lives at the domain root, so relative links are rewritten to start with "/".
    (function () {
      var root = "/";
      document.querySelectorAll("link[href], img[src], a[href]").forEach(function (n) {
        var attr = n.hasAttribute("src") ? "src" : "href";
        var v = n.getAttribute(attr);
        if (!/^(https?:|mailto:|#|\/)/.test(v)) n.setAttribute(attr, root + v.replace(/^\.\//, ""));
      });
    })();
  </script>
</body>
</html>
